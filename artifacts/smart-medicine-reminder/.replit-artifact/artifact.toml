kind = "web"
previewPath = "/"
title = "Smart Medicine Reminder"
description = "A responsive medicine reminder prototype for managing prescriptions, scheduling browser-based alerts, tracking Taken or Skipped doses, and demonstrating a clearly labeled tablet-identification flow."
version = "1.0.0"
id = "artifacts/smart-medicine-reminder"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18167

[services.development]
run = "pnpm --filter @workspace/smart-medicine-reminder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-medicine-reminder", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-medicine-reminder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18167"
BASE_PATH = "/"
